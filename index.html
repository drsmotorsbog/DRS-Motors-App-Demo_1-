<script>
/* Versión nueva publicada: cuando su service worker toma el control, la página se recarga una vez para
   quedar entera en la versión nueva. Si ya llevaba un rato abierta, no se recarga sola: avisa abajo. */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var habia = !!navigator.serviceWorker.controller, hecho = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!habia || hecho) return;
    hecho = true;
    if (performance.now() < 20000) { location.reload(); return; }
    var a = document.getElementById('aviso-escenario');
    if (!a) return;
    a.innerHTML = '<b>Versión nueva</b><span>Toca aquí para verla.</span>';
    a.style.pointerEvents = 'auto'; a.style.cursor = 'pointer';
    a.classList.add('ver');
    a.addEventListener('click', function () { location.reload(); });
  });
})();
</script>
